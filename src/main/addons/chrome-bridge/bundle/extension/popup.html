<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mark Agent Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="mark" src="icon.png" width="36" height="36" alt="" />
      <div>
        <h1>Mark Agent Bridge</h1>
        <span class="subtitle">Chrome kamu, terhubung ke Mark</span>
      </div>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite">Memeriksa koneksi…</p>
      <section aria-label="Tab pilihan">
        <span class="label">TAB PILIHAN</span><strong id="tab-title">Belum ada tab</strong
        ><span id="tab-domain">Pilih satu tab untuk dikendalikan.</span>
      </section>
      <p id="error" role="alert" hidden></p>
      <button id="select" class="primary">Hubungkan tab ini</button>
      <div class="actions">
        <button id="pause" disabled>Jeda</button><button id="disconnect" disabled>Putuskan</button>
      </div>
      <button id="reconnect" class="text-button">Hubungkan ulang</button>
      <p class="hint">Hanya tab pilihan yang dikendalikan. Berpindah tab tidak mengubah target.</p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
