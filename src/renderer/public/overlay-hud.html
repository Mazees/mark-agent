<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARK Computer Use HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      background: #0f1715 !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .hud-capsule {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(31, 184, 84, 0.4);
      border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      color: #e4e4e7;
      transition: all 0.2s ease;
      cursor: default;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite ease-in-out;
    }
    .status-dot.thinking {
      background: #f59e0b;
    }
    .brand-title {
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: #10b981;
    }
    .divider {
      width: 1px;
      height: 14px;
      background: rgba(63, 63, 70, 0.7);
    }
    .action-text {
      font-size: 12px;
      font-weight: 500;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subagent-badge {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      background: #27272a;
      color: #d4d4d8;
      display: none;
    }
    .queue-badge {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      display: none;
    }
    .abort-hint {
      font-size: 10px;
      color: #71717a;
      font-family: monospace;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
  </style>
</head>
<body>
  <div class="hud-capsule" id="hudCapsule">
    <div class="status-dot" id="statusDot"></div>
    <span class="brand-title">MARK</span>

    <div class="divider"></div>

    <div class="subagent-badge" id="sessionBadge">Minibot</div>
    <div class="queue-badge" id="queueBadge">+1 antre</div>

    <div class="action-text">
      <span id="actionLabel">Computer Use Aktif</span>
    </div>

    <div class="divider"></div>
    <span class="abort-hint">Ctrl+Shift+S</span>
  </div>

  <script>
    const statusDot = document.getElementById('statusDot')
    const hudCapsule = document.getElementById('hudCapsule')
    const sessionBadge = document.getElementById('sessionBadge')
    const queueBadge = document.getElementById('queueBadge')
    const actionLabel = document.getElementById('actionLabel')

    function updateHUD(data) {
      if (!data) return
      if (data.sessionName && data.sessionName !== 'Mark Utama') {
        sessionBadge.textContent = data.sessionName
        sessionBadge.style.display = 'inline-block'
      } else {
        sessionBadge.style.display = 'none'
      }

      if (data.detail) {
        actionLabel.textContent = data.detail
      }

      if (data.status === 'thinking' || data.action === 'thinking' || data.action === 'screenshot') {
        statusDot.classList.add('thinking')
      } else {
        statusDot.classList.remove('thinking')
      }

      if (data.queueCount && data.queueCount > 0) {
        queueBadge.textContent = `+${data.queueCount} antre`
        queueBadge.style.display = 'inline-block'
      } else {
        queueBadge.style.display = 'none'
      }
    }

    let ws = null
    function connectWs() {
      const urlParams = new URLSearchParams(location.search)
      const port = urlParams.get('port') || location.port || '3000'
      const host = (location.hostname && location.hostname !== '') ? location.hostname : 'localhost'
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
      const wsUrl = `${proto}//${host}:${port}/stream`

      try {
        ws = new WebSocket(wsUrl)
        ws.onopen = () => {
          // Connected cleanly
        }
        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data)
            if (msg.event === 'computer:hud_update' && msg.data) {
              updateHUD(msg.data)
            }
          } catch (_) {}
        }
        ws.onclose = () => setTimeout(connectWs, 2000)
        ws.onerror = () => ws.close()
      } catch (_) {
        setTimeout(connectWs, 2000)
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.code === 'KeyS') {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ event: 'ai:abort', data: { source: 'hud-overlay', reason: 'User pressed Ctrl+Shift+S' } }))
        }
      }
    })

    connectWs()
  </script>
</body>
</html>
